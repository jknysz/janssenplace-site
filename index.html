<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Janssen Place</title>
  <meta name="description" content="Janssen Place neighborhood website. Coming soon.">
  <meta name="robots" content="noindex">
  <style>
    :root {
      --bg: #f6f3ec;
      --fg: #2b2a27;
      --muted: #6b675e;
      --accent: #3f6b4f;
      --rule: #d9d3c4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1d1b;
        --fg: #ece8dd;
        --muted: #a29d90;
        --accent: #8fc4a0;
        --rule: #35362f;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main { max-width: 34rem; text-align: center; }
    .eyebrow {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: .8rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 1rem;
    }
    h1 {
      font-size: clamp(2.2rem, 8vw, 3.4rem);
      font-weight: normal;
      line-height: 1.1;
      margin: 0 0 1.25rem;
    }
    hr {
      border: 0;
      border-top: 1px solid var(--rule);
      width: 4rem;
      margin: 0 auto 1.25rem;
    }
    p { font-size: 1.1rem; line-height: 1.6; color: var(--muted); margin: 0 0 .75rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Neighborhood website</p>
    <h1>Janssen Place</h1>
    <hr>
    <p>Our new website is on its way.</p>
    <p>Thanks for your patience while we get things set up again.</p>
  </main>
</body>
</html>
